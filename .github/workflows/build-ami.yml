name: Build AMI

on:
  push:
    branches: [main]
    paths:
      - "ror/**"
      - "packer/**"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_BUILD_APP }}
          aws-region: ap-northeast-1

      - name: Setup Packer
        uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0

      - name: Packer init
        run: packer init packer/rails.pkr.hcl

      - name: Packer build
        run: packer build packer/rails.pkr.hcl

      - name: Write AMI ID to SSM
        run: |
          AMI_ID=$(jq -r '.builds[-1].artifact_id' packer/manifest.json | cut -d: -f2)
          aws ssm put-parameter \
            --name "/ec2-packer/prd/ami-id" \
            --value "$AMI_ID" \
            --type String \
            --overwrite
